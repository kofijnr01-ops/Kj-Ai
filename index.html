<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">

<title>KJ AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: Arial, sans-serif;
  background: #050a18;
  color: #fff;
  min-height: 100vh;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 420px;
  height: 90vh;
  margin: auto;
  background: #0b1228;
  border: 1px solid #1d2948;
  border-radius: 28px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px rgba(0,0,0,.45);
}

.header {
  text-align: center;
  padding: 10px 0 18px;
}

.header h1 {
  font-size: 32px;
  margin-bottom: 6px;
}

.header p {
  color: #8b95ad;
  font-size: 14px;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 15px 5px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 82%;
  padding: 13px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-wrap: break-word;
}

.message.ai {
  align-self: flex-start;
  background: #151f3d;
  border: 1px solid #263458;
  border-bottom-left-radius: 5px;
}

.message.user {
  align-self: flex-end;
  background: #2563eb;
  border-bottom-right-radius: 5px;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  padding-top: 10px;
}

.input-area input {
  flex: 1;
  min-width: 0;
  height: 52px;
  padding: 0 16px;
  border: 1px solid #263458;
  border-radius: 17px;
  outline: none;
  background: #070d1f;
  color: #fff;
  font-size: 15px;
}

.input-area input::placeholder {
  color: #68738c;
}

.input-area button {
  height: 52px;
  padding: 0 20px;
  border: none;
  border-radius: 17px;
  background: #2563eb;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.input-area button:active {
  transform: scale(.96);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>KJ AI</h1>
    <p>Your AI Assistant</p>
  </div>

  <div class="chat-box" id="messages">
    <div class="message ai">
      Hello 👋 I'm KJ AI. How can I help you?
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="Ask KJ AI anything..."
    >

    <button id="sendButton">Send</button>
  </div>

</div>

<script>
const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");

function sendMessage() {
  const text = input.value.trim();

  if (text === "") {
    return;
  }

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;

  messages.appendChild(userMessage);

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent = "KJ AI: I'm here to help you.";

  messages.appendChild(aiMessage);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
  input.focus();
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
